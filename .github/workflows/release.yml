name: SIHSalus release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in pom.xml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sihsalus-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/sihsalus-2.8'
    uses: ./.github/workflows/build.yml

  release:
    needs: verify
    if: github.ref == 'refs/heads/sihsalus-2.8'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: module-omod
          path: release
      - name: Check version and release binary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-sihsalus\.[0-9]+$ ]]
          python3 tools/verify_omod.py "release/emrapi-$RELEASE_VERSION.omod"
          cd release
          sha256sum "emrapi-$RELEASE_VERSION.omod" > "emrapi-$RELEASE_VERSION.omod.sha256"
      - name: Attest the tested binary
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/*.omod
      - name: Publish an immutable SIHSalus prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Never overwrite an existing tag or release, including a failed draft.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_VERSION" >&2
            exit 1
          fi
          gh release create "$RELEASE_VERSION" \
            "release/emrapi-$RELEASE_VERSION.omod" \
            "release/emrapi-$RELEASE_VERSION.omod.sha256" \
            --target "$RELEASE_COMMIT" --draft --prerelease \
            --title "emrapi $RELEASE_VERSION" --notes-file SIHSALUS-RELEASE.md
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease --latest=false
